[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsidrift"
version = "0.1.2.dev0"
description = "Label-free validity monitor for computational pathology pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Abhishek Thakur", email = "a.thakur5690@gmail.com"}]
requires-python = ">=3.10"
keywords = [
    "digital-pathology", "drift-detection", "model-monitoring",
    "whole-slide-image", "computational-pathology", "domain-shift"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

[project.urls]
Repository = "https://github.com/athakur569/wsidrift"
Changelog = "https://github.com/athakur569/wsidrift/blob/main/CHANGELOG.md"
"Research repository" = "https://github.com/athakur569/stainrob-benchmark"

[project.optional-dependencies]
torch = ["torch>=2.0.0"]  # only for Tier2Monitor.from_encoder
test = ["pytest>=7"]

[project.scripts]
wsidrift = "wsidrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
