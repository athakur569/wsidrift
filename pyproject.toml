[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsidrift"
version = "0.1.0"
description = "Label-free validity monitor for computational pathology pipelines"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhishek Thakur", email = "a.thakur5690@gmail.com"}]
requires-python = ">=3.10"
keywords = [
    "digital-pathology", "drift-detection", "model-monitoring",
    "whole-slide-image", "computational-pathology", "domain-shift"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-lightning>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "openslide-python>=1.3.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.65.0",
]

[project.scripts]
wsidrift = "wsidrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
