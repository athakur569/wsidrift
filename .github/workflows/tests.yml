name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  locked:
    # The pinned environment in requirements-lock.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install --no-deps -e .
      - run: pytest -q

  latest:
    # Newest dependency versions allowed by pyproject.toml, oldest and newest supported Python.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
